name: CI/CD Pipeline - Microservicio IA

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  create:
    tags:
      - 'ep2'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ealejandro23/ia
  PYTHON_VERSION: '3.11'

jobs:
  # ===========================================================================
  # TESTS
  # ===========================================================================
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install torch CPU
      run: pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu

    - name: Install dependencies
      run: pip install --no-cache-dir -r requirements.txt

    - name: Run tests
      run: |
        pytest tests/ -v 2>&1 || true
        if [ -d "datos/tests" ]; then
          pytest datos/tests/ -v 2>&1 || true
        fi
        echo "Tests step completed"

  # ===========================================================================
  # ENTRENAMIENTO DEL MODELO
  # ===========================================================================
  train:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install torch CPU
      run: pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu

    - name: Install dependencies
      run: pip install --no-cache-dir -r requirements.txt

    - name: Preparar datos
      run: python datos/preparar.py

    - name: Entrenar modelo
      run: python modelo.py

    - name: Subir modelo entrenado
      uses: actions/upload-artifact@v4
      with:
        name: modelo-entrenado
        path: modelo_entrenado.pkl
        retention-days: 1

  # ===========================================================================
  # BUILD AND PUSH
  # ===========================================================================
  build-and-push:
    needs: train
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/ep2')

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Descargar modelo entrenado
      uses: actions/download-artifact@v4
      with:
        name: modelo-entrenado
        path: .

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,prefix=sha-
          type=raw,value=latest

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ===========================================================================
  # TAG EP2
  # ===========================================================================
  tag-ep2:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/ep2')

    permissions:
      contents: read
      packages: write

    steps:
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull latest
      run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

    - name: Tag as ep2
      run: docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ep2

    - name: Push ep2
      run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ep2
